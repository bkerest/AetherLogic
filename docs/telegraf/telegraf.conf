# =====================================================
# TELEGRAF CONFIGURATION - AetherLogic IoT System
# =====================================================
# Purpose: Collect MQTT messages from EMQX broker and
#          forward to InfluxDB v2 time-series database
# Version: 2.0
# Date: 2026-02-15
# =====================================================

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"
  debug = false
  quiet = false
  hostname = "qnap-telegraf"
  omit_hostname = false

# =====================================================
# INPUT: MQTT CONSUMER - SENSOR DATA
# =====================================================
[[inputs.mqtt_consumer]]
  servers = ["ssl://d0a16fcc.ala.eu-central-1.emqxsl.com:8883"]
  username = "vker"
  password = "*****"

  topics = [
    "lora/sensors"
  ]

  qos = 1
  connection_timeout = "30s"
  data_format = "json"

  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z07:00"

  name_override = "air_quality"

  tag_keys = [
    "id",
    "gw",
    "node"
  ]

# =====================================================
# INPUT: MQTT CONSUMER - GATEWAY HEALTH
# =====================================================
[[inputs.mqtt_consumer]]
  servers = ["ssl://d0a16fcc.ala.eu-central-1.emqxsl.com:8883"]
  username = "vker"
  password = "Vk3r00!@#"

  topics = [
    "aetherlogic/gateway/+/health"
  ]

  qos = 1
  connection_timeout = "30s"
  data_format = "json"

  name_override = "gateway_health"

  tag_keys = [
    "gw",
    "type",
    "fw"
  ]

# =====================================================
# PROCESSOR: NODE ID TO LOCATION NAME MAPPING
# =====================================================
[[processors.enum]]
  namepass = ["air_quality"]

  [[processors.enum.mapping]]
    tag = "id"

    [processors.enum.mapping.value_mappings]
      "1" = "Διάδρομος"
      "2" = "Κάθετο 1α"
      "3" = "Κάθετο 2"
      "4" = "Αφρός Ι2"
      "5" = "Κάθετο 1β"

# =====================================================
# OUTPUT: INFLUXDB V2
# =====================================================
[[outputs.influxdb_v2]]
  urls = ["http://192.168.2.5:8086"]
  token = "PBXub80SNgFDogCborB2TPC7ZsfuBKaVFWfnX4WTVguD4-4GizLeFDObTrk4OXK-qiSqXDUJzTxqB1HBq-5rJw=="
  organization = "Hellenic Open University"
  bucket = "eap_plh40"
  timeout = "5s"
  content_encoding = "gzip"
